<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customers - Brew & Bites</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f1ec;
        }

        .header {
            background-color: #6f4e37;
            color: white;
            padding: 20px 30px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            padding: 30px;
        }

        .back {
            color: #6f4e37;
            text-decoration: none;
            font-weight: bold;
        }

        .box {
            background-color: white;
            padding: 25px;
            margin-top: 25px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background-color: #6f4e37;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #543725;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background-color: #6f4e37;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .points {
            font-weight: bold;
            color: #6f4e37;
        }

    </style>

</head>


<body>


    <div class="header">

        <h1>Brew & Bites</h1>

        <p>Customer Management</p>

    </div>


    <div class="container">


        <a href="/dashboard" class="back">
            ← Back to Dashboard
        </a>


        <!-- ADD CUSTOMER -->

        <div class="box">

            <h2>Add Customer</h2>


            <form
                method="POST"
                action="/customers/add"
            >

                <input
                    type="text"
                    name="name"
                    placeholder="Customer Name"
                    required
                >


                <input
                    type="text"
                    name="phone"
                    placeholder="Phone Number"
                    required
                >


                <input
                    type="email"
                    name="email"
                    placeholder="Email"
                >


                <button type="submit">
                    Add Customer
                </button>

            </form>

        </div>


        <!-- CUSTOMER LIST -->

        <div class="box">

            <h2>Customers</h2>


            {% if customers %}

            <table>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Phone</th>

                    <th>Email</th>

                    

                </tr>


                {% for customer in customers %}

                <tr>

                    <td>
                        {{ customer.id }}
                    </td>

                    <td>
                        {{ customer.name }}
                    </td>

                    <td>
                        {{ customer.phone }}
                    </td>

                    <td>
                        {{ customer.email or "-" }}
                    </td>

                   

                </tr>

                {% endfor %}

            </table>


            {% else %}

            <p>No customers found.</p>

            {% endif %}


        </div>


    </div>


</body>

</html>
