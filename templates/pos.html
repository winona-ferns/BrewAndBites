<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Order - Brew & Bites</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f1ec;
        }

        .header {
            background-color: #6f4e37;
            color: white;
            padding: 20px 30px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            padding: 30px;
        }

        .back {
            color: #6f4e37;
            text-decoration: none;
            font-weight: bold;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .item {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .item h3 {
            color: #6f4e37;
        }

        .item button {
            background-color: #6f4e37;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .item button:hover {
            background-color: #543725;
        }

        .cart {
            background-color: white;
            padding: 25px;
            margin-top: 30px;
            border-radius: 10px;
        }

        .cart-item {
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        .quantity-button {
            background-color: #6f4e37;
            color: white;
            border: none;
            padding: 4px 10px;
            margin: 0 5px;
            border-radius: 4px;
            cursor: pointer;
        }

        .remove-button {
            background-color: #c0392b;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .customer-section {
            background-color: white;
            padding: 25px;
            margin-top: 30px;
            border-radius: 10px;
        }

        .customer-section select {
            width: 300px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .total {
            margin-top: 20px;
            font-size: 18px;
        }

        .grand-total {
            font-size: 22px;
            font-weight: bold;
            color: #6f4e37;
        }

        .place-order-button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }

        .place-order-button:hover {
            background-color: #219150;
        }

    </style>

</head>


<body>


    <div class="header">

        <h1>Brew & Bites</h1>

        <p>New Order / POS</p>

    </div>


    <div class="container">


        <a href="/dashboard" class="back">
            ← Back to Dashboard
        </a>


        <h2>Menu</h2>


        <div class="menu-grid">


            {% for item in menu_items %}


            <div class="item">


                <h3>{{ item.name }}</h3>


                <p>
                    Category: {{ item.category }}
                </p>


                <p>
                    Price: ₹{{ item.price }}
                </p>


                <p>
                    Stock: {{ item.stock }}
                </p>


                <button
                    type="button"
                    class="add-button"
                    data-id="{{ item.id }}"
                    data-name="{{ item.name }}"
                    data-price="{{ item.price }}"
                >
                    Add to Cart
                </button>


            </div>


            {% endfor %}


        </div>


        <!-- CUSTOMER SELECTION -->

        <div class="customer-section">

            <h2>Select Customer</h2>

            <select id="customer">

                <option value="">
                    Walk-in Customer
                </option>


                {% for customer in customers %}

                <option value="{{ customer.id }}">
                    {{ customer.name }} - {{ customer.phone }}
                </option>

                {% endfor %}


            </select>

        </div>


        <!-- CART -->

        <div class="cart">


            <h2>Cart</h2>


            <div id="cartItems">
                No items added.
            </div>


            <div class="total">


                <p>
                    Subtotal:
                    ₹<span id="subtotal">0.00</span>
                </p>


                <p>
                    GST (5%):
                    ₹<span id="gst">0.00</span>
                </p>


                <p class="grand-total">
                    Grand Total:
                    ₹<span id="grandTotal">0.00</span>
                </p>


                <!-- PLACE ORDER FORM -->

                <form
                    method="POST"
                    action="/order/place"
                    onsubmit="return prepareOrder()"
                >

                    <input
                        type="hidden"
                        name="customer_id"
                        id="customer_id"
                    >


                    <input
                        type="hidden"
                        name="cart"
                        id="cart_data"
                    >


                    <button
                        type="submit"
                        class="place-order-button"
                    >
                        Place Order
                    </button>

                </form>


            </div>


        </div>


    </div>


    <script>


        let cart = [];


        // Add click event to Add to Cart buttons

        document.querySelectorAll(".add-button").forEach(function(button) {


            button.addEventListener("click", function() {


                let id = parseInt(
                    button.getAttribute("data-id")
                );


                let name = button.getAttribute(
                    "data-name"
                );


                let price = parseFloat(
                    button.getAttribute("data-price")
                );


                addToCart(id, name, price);


            });


        });



        // Add item to cart

        function addToCart(id, name, price) {


            let existingItem = cart.find(
                function(item) {
                    return item.id === id;
                }
            );


            if (existingItem) {

                existingItem.quantity =
                    existingItem.quantity + 1;

            }

            else {

                cart.push({
                    id: id,
                    name: name,
                    price: price,
                    quantity: 1
                });

            }


            displayCart();

        }



        // Display cart

        function displayCart() {


            let cartItems =
                document.getElementById("cartItems");


            if (cart.length === 0) {

                cartItems.innerHTML =
                    "No items added.";

                calculateTotal();

                return;

            }


            let html = "";


            cart.forEach(function(item) {


                let itemTotal =
                    item.price * item.quantity;


                html +=

                    "<div class='cart-item'>" +

                    "<strong>" +
                    item.name +
                    "</strong>" +

                    " - ₹" +
                    item.price.toFixed(2) +

                    " &nbsp; " +

                    "<button type='button' " +
                    "class='quantity-button' " +
                    "onclick='decreaseQuantity(" +
                    item.id +
                    ")'>−</button>" +

                    "<strong>" +
                    item.quantity +
                    "</strong>" +

                    "<button type='button' " +
                    "class='quantity-button' " +
                    "onclick='increaseQuantity(" +
                    item.id +
                    ")'>+</button>" +

                    " &nbsp; = ₹" +
                    itemTotal.toFixed(2) +

                    " &nbsp; " +

                    "<button type='button' " +
                    "class='remove-button' " +
                    "onclick='removeFromCart(" +
                    item.id +
                    ")'>Remove</button>" +

                    "</div>";

            });


            cartItems.innerHTML = html;


            calculateTotal();

        }



        // Increase quantity

        function increaseQuantity(id) {


            let item = cart.find(
                function(item) {
                    return item.id === id;
                }
            );


            if (item) {

                item.quantity =
                    item.quantity + 1;

            }


            displayCart();

        }



        // Decrease quantity

        function decreaseQuantity(id) {


            let item = cart.find(
                function(item) {
                    return item.id === id;
                }
            );


            if (item) {

                item.quantity =
                    item.quantity - 1;


                if (item.quantity <= 0) {

                    removeFromCart(id);

                    return;

                }

            }


            displayCart();

        }



        // Remove item

        function removeFromCart(id) {


            cart = cart.filter(
                function(item) {
                    return item.id !== id;
                }
            );


            displayCart();

        }



        // Calculate subtotal, GST and grand total

        function calculateTotal() {


            let subtotal = 0;


            cart.forEach(function(item) {

                subtotal =
                    subtotal +
                    (item.price * item.quantity);

            });


            let gst =
                subtotal * 0.05;


            let grandTotal =
                subtotal + gst;


            document.getElementById("subtotal").innerText =
                subtotal.toFixed(2);


            document.getElementById("gst").innerText =
                gst.toFixed(2);


            document.getElementById("grandTotal").innerText =
                grandTotal.toFixed(2);

        }



        // Prepare order before sending to Flask

        function prepareOrder() {


            if (cart.length === 0) {

                alert("Please add at least one item to the cart.");

                return false;

            }


            let customer =
                document.getElementById("customer").value;


            document.getElementById("customer_id").value =
                customer;


            document.getElementById("cart_data").value =
                JSON.stringify(cart);


            return true;

        }


    </script>


</body>

</html>
